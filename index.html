<style>
:root{
  /* Бренд Тоҷиктелеком. Опорные значения из гайдлайна и вектора logo.svg */
  --brand-50:#ECF5FE;--brand-100:#C9E6FC;--brand-300:#6FBCF3;
  --brand-500:#2E9BEE;   /* канон: гайдлайн + logo.svg */
  --brand-600:#008CD1;   /* печатный вариант из гайдлайна */
  --brand-700:#0F639F;   /* интерактив: белый текст даёт 6.3:1 ✓ WCAG AA */
  --brand-900:#033C5A;   /* фирменный тёмный, самый частый цвет гайдлайна */
  --accent:#EB691E;
  /* алиасы для совместимости с v1 */
  --navy:#033C5A;--navy2:#012B41;--blue:#2E9BEE;--blue2:#0F639F;--orange:#FFFFFF;
  --ink:#0E2431;--muted:#6A8598;--line:#E3ECF2;--bg:#F4F8FB;--ok:#1FA971;--err:#E0483B;
  --warn:#C77700;
  --tcell:#7A1FA2;--babilon:#E11B22;--megafon:#00A651;--zet:#F07E1A;--anor:#C4122F;--omobile:#E6007E;
  --travel:#0F9D8F;--mnp:#6A4FBF;
  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);background:#06304a;color:var(--ink);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{max-width:1180px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:0 16px;color:#fff}
.top h1{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px}
.top .mk{width:28px;height:28px;background:#fff;color:var(--navy);border-radius:7px;display:grid;place-items:center;font-family:Georgia,serif;font-weight:800}
.ctrls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ctrls select,.ctrls button{font-family:inherit;font-size:13px;border:none;border-radius:9px;padding:10px 12px;cursor:pointer;font-weight:600}
.ctrls select{background:#fff;color:var(--navy);min-width:190px}
.nav-btn{background:rgba(255,255,255,.14);color:#fff}
.nav-btn:active{background:rgba(255,255,255,.3)}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
.lang button{background:transparent;color:#cfe6f6;border-radius:0;padding:10px 12px}
.lang button.on{background:var(--orange);color:var(--navy)}

.demobar{flex:none;background:#06304a;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;color:#fff}
.demobar select{flex:1;min-width:0;font:inherit;font-size:13px;font-weight:600;border:none;border-radius:8px;padding:9px;background:#fff;color:var(--navy)}
.demobar .nav-btn{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:8px;padding:9px 13px;font-weight:700;font-size:15px;cursor:pointer}
.demobar .lang{display:flex;background:rgba(255,255,255,.14);border-radius:8px;overflow:hidden}
.demobar .lang button{background:transparent;color:#cfe6f6;border:none;padding:9px 10px;font-weight:700;font-size:12px;cursor:pointer}
.demobar .lang button.on{background:var(--orange);color:var(--navy)}
.app{flex:1;position:relative;width:100%;max-width:460px;margin:0 auto;overflow:hidden;background:var(--bg)}
#screens{position:absolute;inset:0}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700;z-index:40;color:var(--ink)}
.sb.light{color:#fff}
.sb .r{display:flex;gap:6px;align-items:center;font-size:12px}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:52px 20px 96px}
.scroll::-webkit-scrollbar{width:0}

.appbar{padding:52px 18px 14px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue2));display:flex;align-items:center;gap:12px}
.appbar .back{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:18px;flex:none;cursor:pointer}
.appbar h2{font-size:17px;font-weight:700;flex:1}
.appbar .lg{font-weight:800;letter-spacing:.5px;font-size:16px;display:flex;align-items:center;gap:8px}
.appbar .mk{width:26px;height:26px;background:#fff;color:var(--navy);border-radius:6px;display:grid;place-items:center;font-family:Georgia,serif;font-weight:800;font-size:15px}
.pill{background:rgba(255,255,255,.18);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}

.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.btn.cta{background:var(--brand-700);color:#fff;box-shadow:0 6px 16px rgba(15,99,159,.28)}
.btn.cta:active{background:#0B4E7D}
.btn.sec{background:#fff;color:var(--blue2);border:2px solid var(--blue)}
.btn.ghost{background:#EAF1F6;color:var(--navy)}
.btn[disabled]{background:#C7D3DC;color:#eef;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(3,60,90,.05)}
.title{font-size:22px;font-weight:800;color:var(--navy);line-height:1.2}
.sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.field{background:#EEF3F7;border-radius:12px;padding:14px 16px;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.field .pre{font-weight:700}
.field input{border:none;background:transparent;font:inherit;flex:1;outline:none;color:var(--ink);min-width:0}
.flag{height:5px;display:flex;border-radius:4px;overflow:hidden;margin-top:14px}
.flag i{flex:1}.flag .r{background:#cc0000}.flag .w{background:#fff;flex:1.4}.flag .g{background:#006600}
.chip{display:inline-block;background:#EAF4FC;color:var(--blue2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin:0 4px 4px 0}
.opcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-bottom:10px;cursor:pointer;box-shadow:0 3px 10px rgba(3,60,90,.04)}
.opcard:active{border-color:var(--blue)}
.opcard .nm{font-weight:700;font-size:15px}
.opcard .ds{color:var(--muted);font-size:12px;margin-top:1px}
.badge{background:#fff;color:var(--blue2);border:1px solid var(--blue);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;margin-left:auto;flex:none}
.arrow{color:#B9C9D4;font-size:22px;margin-left:auto;flex:none}

.bottomnav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer}
.bottomnav a.on{color:var(--blue2)}
.bottomnav .ic{font-size:19px}
.cta-fixed{position:absolute;bottom:0;left:0;right:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 28%);z-index:25}

.stepper{display:flex;gap:6px;margin-bottom:16px}
.stepper .s{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.stepper .s .d{height:6px;border-radius:6px;background:var(--line);margin-bottom:6px}
.stepper .s.on .d{background:var(--blue)}
.stepper .s.on{color:var(--navy)}

.cam{flex:1;background:#0c1a24;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative;padding:66px 24px 40px}
.docframe{width:100%;height:200px;border:2px dashed rgba(255,255,255,.6);border-radius:16px;position:relative}
.docframe:before,.docframe:after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--blue)}
.docframe:before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.docframe:after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.oval{width:200px;height:262px;border:3px solid var(--blue);border-radius:50%;background:rgba(45,154,237,.08)}
.shot{width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);margin-top:22px;cursor:pointer}
.hintbar{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px;text-align:center}

.spin{width:74px;height:74px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.big-ic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:50px;margin:0 auto 18px;color:#fff}
.trow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:12px}
.trow b{color:var(--navy);text-align:right}
.tabbar{display:flex;background:#EEF3F7;border-radius:12px;padding:4px;margin-bottom:18px}
.tabbar button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font:inherit;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.tabbar button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.qr{width:176px;height:176px;margin:6px auto 16px;border-radius:14px;background:repeating-conic-gradient(#0E2431 0 25%, #fff 0 50%) 0/22px 22px;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pm{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff}
.pm.on{border-color:var(--blue);background:#F4FAFF}
.pm .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-left:auto;flex:none}
.pm.on .rd{border-color:var(--blue);background:radial-gradient(var(--blue) 40%,#fff 45%)}
.otp{display:flex;gap:9px;justify-content:center;margin:8px 0 4px}
.otp b{width:46px;height:56px;border-radius:12px;background:#EEF3F7;display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--navy)}
.otp b.f{background:#fff;border:2px solid var(--blue)}
.listitem{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px}
.listitem .ic{width:36px;height:36px;border-radius:10px;background:#EAF4FC;display:grid;place-items:center;color:var(--blue2);flex:none}
.progress{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--blue);border-radius:8px}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:12px;line-height:1.5}
.center{text-align:center}
.onbdot{display:flex;gap:7px;justify-content:center;margin:18px 0}
.onbdot i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.onbdot i.on{background:var(--blue);width:22px;border-radius:6px}
.langbig{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.langbig button{display:flex;align-items:center;gap:12px;padding:15px;border-radius:14px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.langbig button.on{border-color:var(--blue);background:#F4FAFF}
.caption{color:#9fc3d8;font-size:12px;text-align:center;margin-top:8px}
.numrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:9px;cursor:pointer}
.numrow.sel{border-color:var(--blue);background:#F4FAFF}
.numrow .n{font-weight:700;font-size:15.5px;letter-spacing:.3px}
.numrow .cat{font-size:11px;font-weight:700;margin-top:2px}

@media(min-width:520px){.app{border-radius:26px;margin:10px auto;box-shadow:0 24px 60px rgba(0,0,0,.5)}}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.mrow .ml{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.mrow .mv{font-size:15px;font-weight:700;color:var(--navy);word-break:break-all}
.cpc{flex:none;background:#EAF4FC;color:var(--blue2);border:none;border-radius:9px;padding:9px 13px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.cpc.done{background:var(--ok);color:#fff}
.note-sec{margin-top:14px;background:#EAF4FC;border-left:4px solid var(--blue);border-radius:0 12px 12px 0;padding:12px 14px;font-size:12.5px;color:var(--ink);line-height:1.5}
</style>
</head>

/* ================= engine ================= */
function total(){return (parseFloat(String(SEL_TAR.p).replace(',','.'))+15).toFixed(0)}
function render(){document.getElementById('screens').innerHTML=S[CUR]();document.getElementById('jump').value=CUR}
function show(i){CUR=Math.max(0,Math.min(S.length-1,+i));window.scrollTo(0,0);render()}
function step(d){show(CUR+d)}
function pickOp(i,go){SEL_OP=OPS[i];SEL_TAR=OPS[i].tars.find(t=>t.best)||OPS[i].tars[0];SEL_NUM='+992 '+(OPS[i].pre==='—'?'9X':OPS[i].pre)+' 123 45 67';show(go||SC.tar)}
function pickTar(i){SEL_TAR=SEL_OP.tars[i];show(SC.tarD)}
function selNum(el,n){document.querySelectorAll('#screens .numrow').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');SEL_NUM=n}
function setLang(l){LANG=l;document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));render()}
function cycleLang(){setLang({ru:'tj',tj:'en',en:'ru'}[LANG])}
function otpPhase(){document.getElementById('loginphase').style.display='none';document.getElementById('otpphase').style.display='block'}
function pmSel(el){document.querySelectorAll('#screens .pm').forEach(o=>o.classList.remove('on'));el.classList.add('on')}
function copyVal(el,t){try{navigator.clipboard&&navigator.clipboard.writeText(t)}catch(e){}var o=el.textContent;el.textContent='✓';el.classList.add('done');setTimeout(function(){el.textContent=o;el.classList.remove('done')},1400)}
const jump=document.getElementById('jump');
TITLES.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t;jump.appendChild(o)});
render();
</script>
